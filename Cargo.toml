[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/llm",
    "crates/process",
    "examples/build-test",
    "examples/composed-workflow",
    "examples/dynamic-workflow",
    "examples/join-reconcile",
    "examples/materialiser",
    "examples/process-task",
    "examples/step-retry",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/itpetey/naaf"
license = "MPL-2.0"

[workspace.dependencies]
futures = { version = "0.3", default-features = false }
serde = { version = "1.0", default-features = false }
serde_json = { version = "1.0", default-features = false }
thiserror = { version = "2.0", default-features = false }
tokio = { version = "1.52", default-features = false }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["default-tls", "json", "query"] }
uuid = { version = "1.23", default-features = false }
