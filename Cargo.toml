[package]
name = "naaf"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/itpetey/naaf"
license = "MPL-2.0"

[dependencies]
futures = "0.3"
pin-project = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.23", features = ["serde", "v4"] }
