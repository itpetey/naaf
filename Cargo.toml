[workspace]
resolver = "2"
members = [
  "crates/orchestrator",
  "crates/model",
  "crates/provider-openai",
  "crates/openspec",
  "crates/cli",
  "crates/tui",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
petgraph = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

model = { path = "crates/model" }
openspec = { path = "crates/openspec" }
