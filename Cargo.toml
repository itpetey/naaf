[workspace]
resolver = "2"
members = [
  "crates/cli",
  "crates/model",
  "crates/openspec",
  "crates/orchestrator",
  "crates/providers",
  "crates/tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/itpetey/naaf"
license = "MPL-2.0"

[workspace.dependencies]
anyhow = { version = "1.0", default-features = false }
chrono = { version = "0.4", default-features = false }
clap = { version = "4.6", default-features = false }
httpmock = { version = "0.8", default-features = false }
petgraph = { version = "0.8", default-features = false }
reqwest = { version = "0.13", default-features = false }
serde = { version = "1.0", default-features = false }
serde_json = { version = "1.0", default-features = false }
tempfile = { version = "3.27", default-features = false }
thiserror = { version = "2.0", default-features = false }
tokio = { version = "1.50", default-features = false }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
uuid = { version = "1.23", default-features = false }

naaf-model = { path = "crates/model" }
naaf-openspec = { path = "crates/openspec" }
