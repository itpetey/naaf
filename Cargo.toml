[workspace]
resolver = "3"
members = [
  "crates/cli",
  "crates/core",
  "crates/knowledge",
  "crates/llm",
  "crates/persistence-fs",
  "crates/persistence-sqlite",
  "crates/process",
  "crates/qdrant",
  "crates/workspace",
  "examples/build-test",
  "examples/composed-workflow",
  "examples/dynamic-workflow",
  "examples/join-reconcile",
  "examples/knowledge-tool",
  "examples/materialiser",
  "examples/process-task",
  "examples/step-retry",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/itpetey/naaf"
license = "MPL-2.0"

[workspace.dependencies]
anyhow = { version = "1.0", default-features = false }
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "serde"
] }
clap = { version = "4", features = ["derive"] }
futures = { version = "0.3", default-features = false }
glob = { version = "0.3" }
ignore = { version = "0.4" }
parking_lot = { version = "0.12", default-features = false }
pdf-extract = { version = "0.10" }
qdrant-client = { version = "1.17" }
reqwest = { version = "0.13", default-features = false, features = [
  "default-tls",
  "json",
  "query"
] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
thiserror = { version = "2.0", default-features = false }
tokio = { version = "1.52", default-features = false }
toml = { version = "1.1" }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
uuid = { version = "1.23", default-features = false, features = ["serde", "v4"] }
